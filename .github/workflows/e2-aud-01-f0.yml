name: E2 AUD F1 audio rapid release regression
on:
  push:
    branches:
      - E2-AUD-01-Resolution
    paths:
      - .github/workflows/e2-aud-01-f0.yml
      - tests/diagnostics/e2-aud-01-rapid-release.mjs
      - src/AudioLanes.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Gating rapid-release regression
        shell: bash
        run: |
          node --experimental-strip-types tests/diagnostics/e2-aud-01-rapid-release.mjs 2>&1 | tee e2-aud-f0.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2-aud-f0-diagnostic
          path: e2-aud-f0.log
