name: E2 AUD F4 capture-loss regression
on:
  push:
    branches: [E2-AUD-01-Resolution]
    paths:
      - .github/workflows/e2-aud-01-f3.yml
      - tests/diagnostics/e2-aud-01-f3-event-trace.mjs
      - src/AudioLanes.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Gating native release and capture-loss regression
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types tests/diagnostics/e2-aud-01-f3-event-trace.mjs 2>&1 | tee f3-event-trace.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2-aud-f3-event-trace
          path: f3-event-trace.log
          retention-days: 14
