name: E2 AUD F3 event-order investigation
on:
  push:
    branches: [E2-AUD-01-Resolution]
    paths:
      - .github/workflows/e2-aud-01-f3.yml
      - tests/diagnostics/e2-aud-01-f3-event-trace.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Non-gating event-order diagnostic
        shell: bash
        run: |
          set +e
          node --experimental-strip-types tests/diagnostics/e2-aud-01-f3-event-trace.mjs > f3-event-trace.log 2>&1
          result=$?
          cat f3-event-trace.log
          echo "Diagnostic exit code: $result" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2-aud-f3-event-trace
          path: f3-event-trace.log
          retention-days: 14
