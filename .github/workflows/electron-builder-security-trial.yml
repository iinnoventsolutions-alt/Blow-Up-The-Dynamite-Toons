name: Electron Builder Security Trial
on:
  workflow_dispatch:
  push:
    branches:
      - Security-Audit-W
permissions:
  contents: read
jobs:
  builder-trial:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Record baseline
        run: |
          node -v
          npm -v
          node -p "require('./package-lock.json').packages['node_modules/electron-builder'].version"
          npm ci
          npm audit --json > baseline-audit.json || true
      - name: Install candidate in isolated CI checkout
        run: |
          npm install --save-dev --save-exact electron-builder@26.17.0
          npm ls electron-builder
          npm audit --json > candidate-audit.json || true
          npm audit --omit=dev
      - name: Model tests and production build
        run: |
          npm test
          npm run build
      - name: Package both Mac architectures without signing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac
      - name: Show package output
        if: always()
        run: ls -lah release/ || true
      - name: Upload audits and installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-trial
          path: |
            baseline-audit.json
            candidate-audit.json
            release/*.dmg
          if-no-files-found: warn
          retention-days: 7
