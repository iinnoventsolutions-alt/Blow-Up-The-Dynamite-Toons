name: RDR Temporary Ubuntu Runner Diagnostic
on:
  workflow_dispatch:
  push:
    branches:
      - Release-Defect-Resolution
    paths:
      - '.github/workflows/rdr-ubuntu-runner-diagnostic.yml'
permissions:
  contents: read
jobs:
  ubuntu-runner-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm Ubuntu runner assignment
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner name: ${{ runner.name }}"
          date -u
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run model and security tests
        run: npm test
      - name: Compile production web application
        run: npm run build
