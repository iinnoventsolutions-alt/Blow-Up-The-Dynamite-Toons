name: RFDR A1.5 D4.6.5 Muxing Toolchain Gate
on:
  push:
    branches: [RFDR-A1.5-D4.6.5-WebM-Muxing-Prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  muxing-toolchain-gate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify unchanged production build
        run: npm run build
      - name: Install CI-only FFmpeg validation utilities
        shell: bash
        run: |
          brew install ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Validate WebM VP8 and Opus toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output
          {
            echo "runner=macos-15"
            echo "node=$(node --version)"
            echo "ffmpeg_path=$(command -v ffmpeg)"
            echo "ffprobe_path=$(command -v ffprobe)"
            ffmpeg -version | head -n 2
            ffprobe -version | head -n 2
            echo "webm muxer:"
            ffmpeg -hide_banner -muxers | grep -E '^[[:space:]]*E[[:space:]]+webm[[:space:]]'
            echo "vp8 decoder:"
            ffmpeg -hide_banner -decoders | grep -E '^[[:space:]]*V[^[:space:]]*[[:space:]]+vp8[[:space:]]'
            echo "opus decoder:"
            ffmpeg -hide_banner -decoders | grep -E '^[[:space:]]*A[^[:space:]]*[[:space:]]+opus[[:space:]]'
            echo "libvpx VP8 encoder:"
            ffmpeg -hide_banner -encoders | grep -E '^[[:space:]]*V[^[:space:]]*[[:space:]]+libvpx[[:space:]]'
            echo "libopus encoder:"
            ffmpeg -hide_banner -encoders | grep -E '^[[:space:]]*A[^[:space:]]*[[:space:]]+libopus[[:space:]]'
          } | tee diagnostic-output/muxing-toolchain.txt
      - name: Validate combined VP8 Opus WebM container baseline
        run: bash scripts/rfdr-d4-6-5b-container-baseline.sh
      - name: Install isolated muxer prototype dependency
        run: npm install --no-save --package-lock=false --ignore-scripts webm-muxer@5.1.4 esbuild@0.28.2
      - name: Inspect muxer BlockGroup and DiscardPadding capabilities
        run: node tests/rfdr-d4-6-5f-muxer-inspection.mjs
      - name: Bundle direct WebCodecs muxing prototype
        run: node -e "import('esbuild').then(m=>m.build({entryPoints:['tests/rfdr-d4-6-5c-browser-muxer.js'],bundle:true,format:'esm',platform:'browser',outfile:'diagnostic-output/d4-6-5c-bundle.js'}))"
      - name: Install Chromium for isolated prototype
        run: npx playwright install chromium
      - name: Test direct WebCodecs WebM muxing
        run: node tests/rfdr-d4-6-5c-direct-muxing.mjs
      - name: Inspect EBML block structure for DiscardPadding extension
        run: python3 scripts/rfdr-d4-6-5g-ebml-inspection.py
      - name: Investigate Opus stream-copy trim metadata
        if: success()
        run: python3 scripts/rfdr-d4-6-5e-trim-feasibility.py
      - name: Prototype final Opus BlockGroup and DiscardPadding
        run: python3 scripts/rfdr-d4-6-5h-padding-prototype.py
      - name: Validate corrected WebM audio metadata and dissolve (strict acceptance)
        run: python3 scripts/rfdr-d4-6-5i-corrected-acceptance.py
      - name: Validate corrected WebM Chromium playback and seeking
        run: node tests/rfdr-d4-6-5j-browser-playback.mjs
      - name: Bundle extended-duration fixture
        run: node -e "import('esbuild').then(m=>m.build({entryPoints:['tests/rfdr-d4-6-5k-browser-fixture.js'],bundle:true,format:'esm',platform:'browser',outfile:'diagnostic-output/d4-6-5k-bundle.js'}))"
      - name: Generate extended-duration normal and stress WebM
        run: node tests/rfdr-d4-6-5k-extended-muxing.mjs
      - name: Validate extended-duration audio and dissolve acceptance
        run: python3 scripts/rfdr-d4-6-5k-extended-acceptance.py
      - name: Bundle silent-export fixture
        run: node -e "import('esbuild').then(m=>m.build({entryPoints:['tests/rfdr-d4-6-5l-silent-fixture.js'],bundle:true,format:'esm',platform:'browser',outfile:'diagnostic-output/d4-6-5l-bundle.js'}))"
      - name: Validate silent-export normal and stress fixtures
        run: node tests/rfdr-d4-6-5l-silent-acceptance.mjs
      - name: Verify isolated WebCodecs cancellation and retry
        run: node tests/rfdr-d4-6-5l1-cancel-retry.mjs
      - name: Diagnose silent-export final-frame duration
        run: python3 scripts/rfdr-d4-6-5l1-silent-endpoint.py
      - name: Prototype silent WebM exact endpoint metadata
        run: python3 scripts/rfdr-d4-6-5l2-duration-prototype.py
      - name: Validate corrected silent WebM Chromium duration and playback
        run: node tests/rfdr-d4-6-5l2-duration-playback.mjs
      - name: Validate corrected silent and audio WebM in Electron
        run: node tests/rfdr-d4-6-5m-electron-playback.mjs
      - name: Confirm original muxer output remains an expected failing negative control
        shell: bash
        run: |
          set +e
          python3 scripts/rfdr-d4-6-5d-padding-dissolve.py > diagnostic-output/d4-6-5i-original-negative-control.log 2>&1
          code=$?
          set -e
          cat diagnostic-output/d4-6-5i-original-negative-control.log
          if [ "$code" -eq 0 ]; then
            echo 'Unexpected original baseline PASS: negative-control assumption changed.'
            exit 1
          fi
          echo 'Original uncorrected baseline correctly fails; corrected-container gate is authoritative.'
      - name: Upload toolchain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RFDR-D4-6-5-toolchain-${{ github.run_id }}
          path: diagnostic-output/
          retention-days: 14
          if-no-files-found: error
