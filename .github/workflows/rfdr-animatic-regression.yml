name: RFDR Animatic Electron Recording Contract
on:
  push:
    branches: [RFDR-Animatic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  electron-recording-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Previously accepted Electron recording handshake
        run: node --test tests/animatic-electron-handshake.test.mjs

  animatic-webm-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - name: Validate exported WebM video, audio, transitions and cancel
        run: node --experimental-strip-types tests/ui-audio.mjs
      - name: Preserve failing export diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rfdr-animatic-webm-diagnostics
          path: test-results/
          if-no-files-found: ignore
