name: RFDR B1.5 Isolated Workflow Validation
on:
  push:
    branches:
      - RFDR-RI2-B1-4-Workflow-Retirement
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflow definitions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.23'
      - name: Run actionlint on all workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
