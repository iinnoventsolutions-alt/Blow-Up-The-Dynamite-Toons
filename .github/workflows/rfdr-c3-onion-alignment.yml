name: RFDR C3.5 Onion Skin Alignment Gate
on:
  push:
    branches:
      - RFDR-C3.5-Onion-Skin-Resolution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onion-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Onion canvas alignment and tint regression
        run: node --experimental-strip-types tests/ui-onion.mjs
