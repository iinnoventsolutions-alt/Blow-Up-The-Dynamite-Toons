name: RFDR N2/N3.4 Deterministic Fixture Contract Gate
on:
  push:
    branches: [RFDR-A1.5-D4.6.5-WebM-Muxing-Prototype]
    paths:
      - 'tests/rfdr-n2-deterministic-export-contract.test.mjs'
      - '.github/workflows/rfdr-n2-red-contract.yml'
      - 'src/deterministic-export-adapter.ts'
      - 'src/deterministic-frame-metadata.ts'
      - 'src/deterministic-audio-mixer.ts'
      - 'tests/rfdr-n3-4-adapter-integration.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n2-fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install and type-check
        run: |
          npm ci
          npx tsc --noEmit
      - name: Validate N2 and N3.4 GREEN fixture contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output
          node --experimental-strip-types --test tests/rfdr-n2-deterministic-export-contract.test.mjs tests/rfdr-n3-4-adapter-integration.test.mjs tests/rfdr-n3-1-frame-scheduler.test.mjs tests/rfdr-n3-2-frame-metadata.test.mjs tests/rfdr-n3-3-audio-mixer.test.mjs 2>&1 | tee diagnostic-output/n2-n34-contract.log
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RFDR-N2-N34-GREEN-Contract-Evidence
          path: diagnostic-output/n2-n34-contract.log
          retention-days: 14
