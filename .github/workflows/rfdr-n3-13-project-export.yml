name: RFDR N3.13 Isolated Project Export Bridge
on:
  push:
    branches: [RFDR-A1.5-D4.6.5-WebM-Muxing-Prototype]
    paths:
      - 'src/deterministic-project-export.ts'
      - 'tests/rfdr-n3-13-project-export.mjs'
      - '.github/workflows/rfdr-n3-13-project-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node tests/rfdr-n3-13-project-export.mjs
