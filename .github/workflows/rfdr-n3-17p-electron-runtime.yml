name: RFDR N3.17-P Real Electron Runtime Smoke
on:
  push:
    branches: [RFDR-A1.5-D4.6.5-WebM-Muxing-Prototype]
    paths:
      - 'tests/rfdr-n3-17p-electron-runtime.cjs'
      - '.github/workflows/rfdr-n3-17p-electron-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  electron-runtime:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: ./node_modules/.bin/electron tests/rfdr-n3-17p-electron-runtime.cjs
