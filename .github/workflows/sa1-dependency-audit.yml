name: SA-1 Dependency Audit
on:
  push:
    branches: [Working, Security-Audit-W]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sa1-dependency-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit all dependencies (moderate and above)
        run: npm audit --audit-level=moderate
      - name: Audit production dependencies (moderate and above)
        if: always()
        run: npm audit --omit=dev --audit-level=moderate
